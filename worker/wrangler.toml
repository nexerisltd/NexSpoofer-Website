# Cloudflare Worker config for the NexSpoofer media proxy.
#
# Deploy with: npx wrangler deploy   (from inside this worker/ folder)
# Then set the secrets (never put these in this file, they're not
# committed as plaintext — see README.md in this folder):
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put ENCRYPTION_KEY
#
# Deliberately NOT setting `account_id` here — leaving it out lets this
# same file deploy to any Cloudflare account via the CLOUDFLARE_ACCOUNT_ID
# environment variable, which is what deploy-server.mjs / deploy-all.mjs
# use to target a different provider's account per deployment. See
# DEPLOY-MULTIPLE.md.

name = "nexspoofer-media"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Optional static baseline — same idea as the Next.js app's env var of the
# same name. Primary control is still the /sa "Approved Media Domains"
# panel, which both this Worker and the Next.js app read from the same
# Supabase table.
ALLOWED_MEDIA_HOSTS = ""

# The Next.js app's deployed origin — used to set
# Access-Control-Allow-Origin (browser CORS) AND as the Referer/Origin
# anti-leak guard added in worker/src/index.ts. Update this if your app's
# domain ever changes, and redeploy every server that uses this file.
ALLOWED_ORIGIN = "https://nexspoofer.vercel.app"
